name: Парсер квартир

on:
  # Запуск вручную (для тестов)
  workflow_dispatch:
  
  # Запуск по сигналу от cron-job.org
  repository_dispatch:
    types: [cron-job]

jobs:
  parse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4
      
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Установить зависимости
        run: |
          pip install -r requirements.txt
          
      - name: Установить браузер для Playwright
        run: |
          playwright install chromium
          playwright install-deps
          
      - name: Запустить парсер
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      
      - name: Сохранить изменения в репозиторий
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Автообновление $(date +'%Y-%m-%d %H:%M:%S')" || echo "Нет изменений"
          git push
