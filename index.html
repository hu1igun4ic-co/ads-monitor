<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ETAGI — мониторинг квартир</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== ХЕДЕР ===== */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .header h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #58a6ff, #f0883e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header .sub {
    font-size: 7px;
    color: #8b949e;
    letter-spacing: 2px;
    margin-top: 2px;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* ===== ФИЛЬТРЫ ===== */
  .filters {
    max-width: 900px;
    width: 100%;
    margin: 0 auto 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    background: #161b22;
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid #30363d;
  }

  .filters input {
    padding: 8px 12px;
    border: 1px solid #30363d;
    border-radius: 6px;
    font-size: 13px;
    background: #0d1117;
    color: #e6edf3;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
  }

  .filters input::placeholder {
    color: #8b949e;
  }

  .filters input:focus {
    border-color: #58a6ff;
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
  }

  .filters input[type="text"] {
    flex: 1;
    min-width: 180px;
  }

  .filters input[type="number"] {
    width: 120px;
  }

  /* ===== СЧЁТЧИК ===== */
  .count {
    text-align: center;
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 16px;
    width: 100%;
    max-width: 900px;
  }

  /* ===== СПИСОК (1 КОЛОНКА) ===== */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* ===== КАРТОЧКА ===== */
  .card {
    background: #161b22;
    border-radius: 10px;
    padding: 12px 16px;
    border: 1px solid #30363d;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: default;
    position: relative;
    min-height: 70px;
  }

  .card:hover {
    border-color: #58a6ff;
    background: #1c2128;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .card.new {
    border-color: #f0883e;
  }

  /* ===== ПРЕВЬЮ КАРТИНКИ ===== */
  .card .preview {
    width: 80px;
    height: 60px;
    border-radius: 6px;
    object-fit: cover;
    background: #0d1117;
    border: 1px solid #30363d;
    flex-shrink: 0;
  }

  .card .preview-placeholder {
    width: 80px;
    height: 60px;
    border-radius: 6px;
    background: #0d1117;
    border: 1px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #30363d;
    flex-shrink: 0;
  }

  /* ===== ИНФО-БЛОК ===== */
  .card .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* АДРЕС — всегда виден */
  .card .address {
    font-size: 15px;
    font-weight: 500;
    color: #f0f6fc;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== СКРЫТЫЙ КОНТЕНТ (показывается при наведении) ===== */
  .card .hidden-content {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.2s ease;
    margin-top: 0;
  }

  .card:hover .hidden-content {
    max-height: 80px;
    opacity: 1;
    margin-top: 4px;
  }

  .card .hidden-content .price {
    font-size: 16px;
    font-weight: 700;
    color: #f0883e;
    white-space: nowrap;
  }

  .card .hidden-content .phone {
    font-size: 13px;
    color: #58a6ff;
    background: #0d1117;
    padding: 1px 10px;
    border-radius: 12px;
    border: 1px solid #30363d;
    white-space: nowrap;
  }

  .card .hidden-content .source-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 1px 10px;
    border-radius: 12px;
    background: #1f6feb;
    color: #fff;
    white-space: nowrap;
  }

  .card .hidden-content .new-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 1px 10px;
    border-radius: 12px;
    background: #d29922;
    color: #0d1117;
    white-space: nowrap;
  }

  .card .hidden-content .also-badge {
    font-size: 10px;
    color: #8b949e;
    background: #21262d;
    padding: 1px 10px;
    border-radius: 12px;
    border: 1px solid #30363d;
    white-space: nowrap;
  }

  /* ССЫЛКА — появляется при наведении */
  .card .url-link {
    color: #58a6ff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    transition: color 0.15s;
    white-space: nowrap;
  }

  .card .url-link:hover {
    color: #79c0ff;
    text-decoration: underline;
  }

  /* ===== ПУСТОЙ СОСТОЯНИЕ ===== */
  .empty {
    text-align: center;
    color: #8b949e;
    margin-top: 50px;
    font-size: 14px;
  }

  /* ===== АДАПТИВ ===== */
  @media (max-width: 600px) {
    body { padding: 16px 10px; }
    .card { flex-wrap: wrap; gap: 10px; }
    .card .preview,
    .card .preview-placeholder {
      width: 60px;
      height: 45px;
    }
    .card .address { font-size: 13px; white-space: normal; }
    .filters input[type="number"] { width: 100%; }
    .filters input[type="text"] { min-width: 140px; }
    .card:hover .hidden-content { max-height: 120px; }
    .header h1 { font-size: 20px; }
  }

  @media (max-width: 420px) {
    .card .preview,
    .card .preview-placeholder {
      width: 50px;
      height: 38px;
    }
    .card .address { font-size: 12px; }
    .card .hidden-content .price { font-size: 14px; }
    .card .hidden-content .phone { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ===== ХЕДЕР ===== -->
<div class="header">
  <h1>ETAGI</h1>
  <div class="sub">by hu1igun4ic</div>
</div>

<!-- ===== ФИЛЬТРЫ ===== -->
<div class="filters">
  <input type="text" id="searchBox" placeholder="🔍 Поиск по адресу...">
  <input type="number" id="priceMin" placeholder="₽ от">
  <input type="number" id="priceMax" placeholder="₽ до">
</div>

<p class="count" id="count">Загрузка...</p>

<!-- ===== СПИСОК ===== -->
<div id="list" class="grid"></div>
<p id="empty" class="empty" style="display:none;">Пока нет данных. Дождитесь первого запуска парсера.</p>

<script>
let allData = [];

function priceToNumber(price) {
  const digits = (price || "").replace(/\D/g, "");
  return digits ? parseInt(digits, 10) : null;
}

function render() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const min = parseInt(document.getElementById('priceMin').value) || null;
  const max = parseInt(document.getElementById('priceMax').value) || null;

  const filtered = allData.filter(item => {
    if (search && !item.title.toLowerCase().includes(search)) return false;
    const p = priceToNumber(item.price);
    if (min && (!p || p < min)) return false;
    if (max && (!p || p > max)) return false;
    return true;
  });

  document.getElementById('count').textContent = `📊 ${filtered.length} из ${allData.length}`;

  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!filtered.length) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = allData.length ? '🔍 Ничего не найдено.' : '⏳ Нет данных.';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  const dayAgo = Date.now() - 24 * 60 * 60 * 1000;

  filtered.forEach(item => {
    const isNew = new Date(item.first_seen).getTime() > dayAgo;
    const card = document.createElement('div');
    card.className = 'card' + (isNew ? ' new' : '');

    // Источники для бейджей "Также"
    const alsoOn = (item.also_on || []).length
      ? `<span class="also-badge">➕ ${item.also_on.join(', ')}</span>` : '';

    // Телефон (если есть в данных, иначе заглушка)
    const phone = item.phone || '+7 (XXX) XXX-XX-XX';

    // Превью (если есть картинка)
    const previewHtml = item.image
      ? `<img class="preview" src="${item.image}" alt="Фото" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="preview-placeholder">🏠</div>`;

    card.innerHTML = `
      ${previewHtml}
      <div class="info">
        <div class="address">${item.title}</div>
        <div class="hidden-content">
          <span class="price">${item.price}</span>
          <span class="phone">📞 ${phone}</span>
          <span class="source-badge">${item.source}</span>
          ${isNew ? '<span class="new-badge">🔥 Новое</span>' : ''}
          ${alsoOn}
          <a class="url-link" href="${item.url}" target="_blank">→ Открыть</a>
        </div>
      </div>
    `;

    list.appendChild(card);
  });
}

// Загрузка данных
fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allData = data;
    render();
  })
  .catch(() => {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = '❌ Ошибка загрузки данных.';
  });

// Фильтры
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('priceMin').addEventListener('input', render);
document.getElementById('priceMax').addEventListener('input', render);
</script>

</body>
</html>
