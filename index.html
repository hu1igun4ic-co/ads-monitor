<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квартиры — Циан, RU09, Сибдом</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
  h1 { text-align: center; }
  .filters { max-width: 1200px; margin: 0 auto 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; background: white; padding: 16px; border-radius: 8px; }
  .filters input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  .filters input[type="text"] { flex: 1; min-width: 200px; }
  .filters input[type="number"] { width: 130px; }
  .count { text-align: center; color: #666; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .card.new { border: 2px solid #e74c3c; }
  .badge { display: inline-block; background: #3498db; color: white; font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; margin-right: 4px; }
  .badge.also { background: #7f8c8d; }
  .price { font-weight: bold; font-size: 18px; margin: 8px 0; }
  a { color: #2980b9; text-decoration: none; }
  .empty { text-align: center; color: #888; margin-top: 40px; }
</style>
</head>
<body>
<h1>Квартиры — Циан, RU09, Сибдом</h1>

<div class="filters">
  <input type="text" id="searchBox" placeholder="Поиск по району/адресу/тексту...">
  <input type="number" id="priceMin" placeholder="Цена от, ₽">
  <input type="number" id="priceMax" placeholder="Цена до, ₽">
</div>

<p class="count" id="count"></p>
<div id="list" class="grid"></div>
<p id="empty" class="empty" style="display:none;">Пока нет данных. Дождись первого запуска парсера в Actions.</p>

<script>
let allData = [];

function priceToNumber(price) {
  const digits = (price || "").replace(/\D/g, "");
  return digits ? parseInt(digits, 10) : null;
}

function render() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const min = parseInt(document.getElementById('priceMin').value) || null;
  const max = parseInt(document.getElementById('priceMax').value) || null;

  const filtered = allData.filter(item => {
    if (search && !item.title.toLowerCase().includes(search)) return false;
    const p = priceToNumber(item.price);
    if (min && (!p || p < min)) return false;
    if (max && (!p || p > max)) return false;
    return true;
  });

  document.getElementById('count').textContent = `Показано: ${filtered.length} из ${allData.length}`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!filtered.length) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = allData.length ? 'Ничего не найдено по фильтру.' : 'Пока нет данных.';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
  filtered.forEach(item => {
    const isNew = new Date(item.first_seen).getTime() > dayAgo;
    const card = document.createElement('div');
    card.className = 'card' + (isNew ? ' new' : '');
    const alsoOn = (item.also_on || []).length
      ? `<span class="badge also">Также: ${item.also_on.join(', ')}</span>` : '';
    card.innerHTML = `
      <span class="badge">${item.source}</span>
      ${isNew ? '<span class="badge" style="background:#e74c3c;">Новое</span>' : ''}
      ${alsoOn}
      <div>${item.title}</div>
      <div class="price">${item.price}</div>
      <a href="${item.url}" target="_blank">Открыть объявление →</a>
    `;
    list.appendChild(card);
  });
}

fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allData = data;
    render();
  })
  .catch(() => {
    document.getElementById('empty').style.display = 'block';
  });

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('priceMin').addEventListener('input', render);
document.getElementById('priceMax').addEventListener('input', render);
</script>
</body>
</html>
