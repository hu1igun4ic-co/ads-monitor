<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-weight: 700;
    font-size: 28px;
    background: linear-gradient(135deg, #58a6ff, #f0883e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }

  .filters {
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    background: #161b22;
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid #30363d;
  }

  .filters input {
    padding: 10px 14px;
    border: 1px solid #30363d;
    border-radius: 8px;
    font-size: 14px;
    background: #0d1117;
    color: #e6edf3;
    transition: border 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .filters input::placeholder {
    color: #8b949e;
  }

  .filters input:focus {
    border-color: #58a6ff;
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
  }

  .filters input[type="text"] {
    flex: 1;
    min-width: 200px;
  }

  .filters input[type="number"] {
    width: 140px;
  }

  .count {
    text-align: center;
    color: #8b949e;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .count span {
    color: #f0883e;
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: #161b22;
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid #30363d;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: #58a6ff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .card.new {
    border-color: #f0883e;
    background: #1c1b16;
  }

  .card .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    width: fit-content;
    margin-right: 4px;
  }

  .badge.source {
    background: #1f6feb;
    color: #fff;
  }

  .badge.new-badge {
    background: #d29922;
    color: #0d1117;
  }

  .badge.also {
    background: #21262d;
    color: #8b949e;
    border: 1px solid #30363d;
  }

  .card .title {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
    margin: 4px 0 2px;
    color: #f0f6fc;
  }

  .card .price {
    font-size: 20px;
    font-weight: 700;
    color: #f0883e;
    margin: 4px 0;
  }

  .card .url-link {
    color: #58a6ff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    margin-top: 4px;
    transition: color 0.15s;
    width: fit-content;
  }

  .card .url-link:hover {
    color: #79c0ff;
    text-decoration: underline;
  }

  .card .meta {
    font-size: 12px;
    color: #8b949e;
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .empty {
    text-align: center;
    color: #8b949e;
    margin-top: 60px;
    font-size: 16px;
  }

  @media (max-width: 640px) {
    .filters input[type="number"] {
      width: 100%;
    }
    .grid {
      grid-template-columns: 1fr;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
